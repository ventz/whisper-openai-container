name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fail instead of silently re-resolving when a uv.lock is out of date.
  UV_LOCKED: "1"

jobs:
  check:
    name: Lint, tests and synth
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test

      - name: Validate Terraform
        run: |
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform validate

      # Synthesizes the CloudFormation template only; nothing is built or
      # deployed, and no AWS credentials are available.
      - name: Synthesize CDK app
        working-directory: infra/cdk
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install cdk synth --quiet

  image:
    name: Image build and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The smallest model keeps the job fast; every model goes through the same
      # download and hash check.
      - name: Build image
        run: make build MODEL=tiny PLATFORM=linux/amd64

      - name: Transcribe the sample
        run: |
          make transcribe FILE=samples/recording.m4a FORMATS=txt,json PLATFORM=linux/amd64
          test -s samples/recording.m4a.txt
          cat samples/recording.m4a.txt

      # Imports the handler the way Lambda does: settings check, temp cleanup
      # and model load, without touching S3.
      - name: Load the Lambda handler
        run: |
          docker run --rm --platform linux/amd64 --network none -e ALLOWED_BUCKETS=example \
            --entrypoint python whisper -c "import app; print('handler', app.handler.__name__)"
