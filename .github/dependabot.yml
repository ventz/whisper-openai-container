# container/requirements*.txt are checked by .github/workflows/dependencies.yml.
version: 2

multi-ecosystem-groups:
  cdk:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a release, so a hijacked one is usually pulled first.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # The Lambda base image, pinned by digest. Only digest updates: a new Python
  # version needs container/requirements*.txt recompiled for it, so that is
  # done by hand.
  - package-ecosystem: docker
    directory: /container
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Dev tools: pytest, ruff and the test-only copies of av and boto3.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]

  # aws-cdk-lib (uv) and the CDK CLI (npm) are updated in one pull request: a
  # new aws-cdk-lib often needs a new CLI, and either one alone fails synth.
  - package-ecosystem: uv
    directory: /infra/cdk
    patterns: ["*"]
    multi-ecosystem-group: cdk
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /infra/cdk
    patterns: ["*"]
    multi-ecosystem-group: cdk
    cooldown:
      default-days: 7

  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
